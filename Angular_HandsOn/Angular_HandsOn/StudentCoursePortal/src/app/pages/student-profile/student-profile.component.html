<div class="profile-container">
  <div class="profile-card">
    <div class="avatar-circle">AJ</div>
    <div class="student-info">
      <h2>{{ studentName }}</h2>
      <p class="email">📧 {{ studentEmail }}</p>
      <p class="gpa-badge">Cumulative GPA: <strong>{{ gpa }}</strong></p>
    </div>
  </div>

  <div class="enrolled-section">
    <h3>Enrolled Courses</h3>

    <div *ngIf="enrolledCourses.length > 0; else noEnrolled" class="enrolled-list">
      <div *ngFor="let course of enrolledCourses" class="enrolled-card">
        <div class="enrolled-info">
          <span class="code">{{ course.code }}</span>
          <h4>{{ course.name }}</h4>
          <span class="credits">{{ course.credits | creditLabel }}</span>
        </div>
        <button class="btn-unenroll" (click)="unenroll(course.id)">Unenroll</button>
      </div>
    </div>

    <ng-template #noEnrolled>
      <div class="empty-box">
        <p>You have not enrolled in any courses yet.</p>
        <a routerLink="/courses" class="browse-link">Browse Course Catalog</a>
      </div>
    </ng-template>
  </div>
</div>
