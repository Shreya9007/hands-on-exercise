<div class="notification-widget">
  <div class="header-row">
    <h5>🔔 Notifications (Scoped DI Instance #{{ instanceId }})</h5>
    <button class="btn-sm" (click)="addNotice()">+ Add Scoped Notice</button>
  </div>
  <ul>
    <li *ngFor="let notice of notifications">{{ notice }}</li>
  </ul>
  <p class="comment-explanation">
    ℹ️ Comment: Specified `providers: [NotificationService]` creates a unique isolated instance for this component.
  </p>
</div>
